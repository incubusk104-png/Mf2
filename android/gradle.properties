# ── Activity-sync OAuth credentials (Strava / Polar) ─────────────────────
# NOT set here on purpose: unlike the Supabase anon key, a Polar client
# SECRET is a real credential, not a public client key — committing it to
# a public repo hands out an app-impersonation credential to anyone.
#
# Without these, the app still builds, but PolarClient.isConfigured is
# false and StravaAuthClient behaves the same way, so their "Connect"
# buttons show a "not configured for this build yet" message instead of
# opening the OAuth screen (Google Health Connect is unaffected — it
# needs no client id, just the on-device permission dialog).
#
# To enable them for a LOCAL build, uncomment and fill these in (get the
# values from https://admin.polaraccesslink.com/ and https://strava.com/settings/api
# — they're the same values already stored as Supabase Edge Function
# secrets, visible in Supabase Dashboard -> Edge Functions -> Secrets):
#mindset.stravaClientId=
#mindset.polarClientId=
#mindset.polarClientSecret=
#
# For CI (GitHub Actions) builds, prefer repo secrets instead — see the
# STRAVA_CLIENT_ID / POLAR_CLIENT_ID / POLAR_CLIENT_SECRET_KEY env vars
# in .github/workflows/build.yml.
