name: apply-build-fix

# Throwaway: overlays the two fixed Kotlin files onto main, byte-exactly.
# Fails loudly if the payload is corrupt or touches more than those two files.
# Deleted as soon as the fix is confirmed on main.
on:
  push:
    branches: ["apply-build-fix"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify payload
        env:
          PAYLOAD_URL: "https://static.teamily.ai/sites/ca636d4d-36c6-4407-9059-24fdbab23b20/documents/mf2_build_fix_payload/mf2_build_fix_payload.zip"
          PAYLOAD_SHA256: "5e8e44301c7df65386751e91cc2a45f92787e280fe4e95609ba421eff2f4ed09"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/upd.zip "$PAYLOAD_URL"
          echo "$PAYLOAD_SHA256  /tmp/upd.zip" | sha256sum -c -
          mkdir -p /tmp/upd
          unzip -q /tmp/upd.zip -d /tmp/upd
          SRC=/tmp/upd/android/app/src/main/java/com/rork/mindsetframestracker/notifications
          test -f "$SRC/TimerNotifier.kt"
          test -f "$SRC/HabitCheckInNotifier.kt"
          DST=android/app/src/main/java/com/rork/mindsetframestracker/notifications
          cp -a "$SRC/TimerNotifier.kt" "$DST/TimerNotifier.kt"
          cp -a "$SRC/HabitCheckInNotifier.kt" "$DST/HabitCheckInNotifier.kt"
          echo "payload applied"

      - name: Validate byte-exactness and scope
        run: |
          set -euo pipefail
          D=android/app/src/main/java/com/rork/mindsetframestracker/notifications
          echo "TimerNotifier       -> $(git hash-object --no-filters "$D/TimerNotifier.kt")"
          echo "HabitCheckInNotifier -> $(git hash-object --no-filters "$D/HabitCheckInNotifier.kt")"
          test "$(git hash-object --no-filters "$D/TimerNotifier.kt")" = "7fbc54e8102ce75a6385cda2befd6e83b9a4799f"
          test "$(git hash-object --no-filters "$D/HabitCheckInNotifier.kt")" = "7851bae8bfedd17bcefc42c8e0ab397cbcd945c0"
          echo "--- changed paths ---"
          git diff --name-only
          test "$(git diff --name-only | wc -l)" = "2"
          echo "scope ok: exactly two files"

      - name: Commit and push the two files to main
        run: |
          set -euo pipefail
          D=android/app/src/main/java/com/rork/mindsetframestracker/notifications
          git config user.name "Mobile App Builder"
          git config user.email "agent@teamily.ai"
          git add "$D/TimerNotifier.kt" "$D/HabitCheckInNotifier.kt"
          git commit -m "Fix release build: unresolved references blocking :app:compileReleaseKotlin" -m "The release build failed at :app:compileReleaseKotlin with 6 errors, all caused by a rename that left callers behind."
          git push origin HEAD:main
          echo "--- pushed ---"
          git log --oneline -1
