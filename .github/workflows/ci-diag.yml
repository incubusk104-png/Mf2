name: ci-diag-compile
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Compile release kotlin only
        continue-on-error: true
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace > /tmp/build.log 2>&1
          echo "exit=$?" >> /tmp/build.log
      - name: Extract errors
        run: |
          set +e
          { echo "===== e: lines ====="; grep -nE "^e: " /tmp/build.log | head -80; echo; echo "===== error:/What went wrong ====="; grep -nE "error:|What went wrong|Execution failed|Compilation error|Caused by" /tmp/build.log | head -60; echo; echo "===== tail 120 ====="; tail -120 /tmp/build.log; } > .ci-error.txt 2>&1
          wc -l .ci-error.txt
      - name: Commit error report
        run: |
          git config user.name "Mobile App Builder"
          git config user.email "agent@teamily.ai"
          git add -f .ci-error.txt
          git commit -m "ci: capture kotlin compile errors" || echo "no change"
          git push origin HEAD:ci-diag
