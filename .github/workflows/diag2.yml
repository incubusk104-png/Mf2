name: diag-build

# Throwaway diagnostic: compiles the CURRENT main and publishes the compiler
# output into the repo as diag.txt, so the failing build can be diagnosed
# without repository admin rights (job logs are not readable anonymously).
# Deleted as soon as the real fix is confirmed.
on:
  push:
    branches:
      - diag2
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile and capture compiler diagnostics
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew :app:compileReleaseKotlin --console=plain --no-daemon > /tmp/compile.log 2>&1
          echo "exit=$?" > /tmp/diag.txt
          echo "--- kotlin errors ---" >> /tmp/diag.txt
          grep -E "^e: " /tmp/compile.log >> /tmp/diag.txt
          echo "--- other error lines ---" >> /tmp/diag.txt
          grep -E "Unresolved reference|Cannot infer|error:|FAILURE|What went wrong|Could not|Execution failed" /tmp/compile.log | head -120 >> /tmp/diag.txt
          echo "--- tail of log ---" >> /tmp/diag.txt
          tail -60 /tmp/compile.log >> /tmp/diag.txt
          cp /tmp/diag.txt ../diag.txt
          wc -l ../diag.txt

      - name: Publish diagnostics to a readable branch
        run: |
          set -euo pipefail
          cd ..
          git config user.name "diag"
          git config user.email "diag@example.com"
          git checkout -B diag2-result
          git add -f diag.txt
          git commit -m "Compiler diagnostics for current main"
          git push -f origin diag2-result
