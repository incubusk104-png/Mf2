name: Build

# Builds a RELEASE APK on GitHub so you can review / install the result.
# - Runs on every push and pull request.
# - Can also be started manually: Actions tab -> "Build" -> "Run workflow".
# - Produces a downloadable, SIGNED release APK artifact.
#
# The Gradle project lives in the android/ subfolder of this repo, so every
# step runs with android/ as its working directory.
#
# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED ONE-TIME SETUP (release builds must be signed):
# Add these repository secrets under
#   Settings -> Secrets and variables -> Actions -> New repository secret
#
#   KEYSTORE_BASE64   base64 of your release.keystore file
#                       macOS/Linux : base64 -i release.keystore | pbcopy
#                       Linux       : base64 -w0 release.keystore
#                       Windows PS  : [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.keystore"))
#   KEYSTORE_PASSWORD keystore (store) password
#   KEY_ALIAS         key alias inside the keystore
#   KEY_PASSWORD      key (alias) password
#
# Don't have a keystore yet? Create one:
#   keytool -genkeypair -v -keystore release.keystore -alias mindset \
#     -keyalg RSA -keysize 2048 -validity 10000
# Keep release.keystore safe and NEVER commit it.
# ─────────────────────────────────────────────────────────────────────────────
#
# OPTIONAL (activity-sync integrations): to have Strava/Polar "Connect"
# actually work in APKs built by this workflow, also add:
#   STRAVA_CLIENT_ID          Strava API app's public Client ID
#   POLAR_CLIENT_ID           Polar AccessLink API client id (PUBLIC)
#
# NOTE: Polar's client SECRET must NOT be supplied as a build secret. It is
# held server-side by the polar-token-exchange Edge Function, so it never
# reaches the APK. Supplying it here would bake it into BuildConfig, where it
# is trivially extractable from the shipped dex.
# (Same values already stored as Supabase Edge Function secrets. Without
# these, the app still builds fine, but the Strava/Polar Connect buttons
# will show "isn't configured for this build yet." instead of opening
# the OAuth consent screen. Google Health Connect does not need any of
# these — it uses an on-device permission dialog, no client id.)
# ─────────────────────────────────────────────────────────────────────────────
#
# REQUIRED (backend connectivity — sign-in, backup/restore, and BOTH the
# Strava/Polar token-exchange Edge Functions AND their runtime client-id
# discovery fallback all depend on this): add
#   SUPABASE_URL         Project Settings -> API -> Project URL
#   SUPABASE_ANON_KEY    Project Settings -> API -> anon / publishable key
# NOT the values on the "Edge Function Secrets" page — that page only
# configures the server-side Edge Functions themselves and is never read
# by the Android build. Without these two, BuildConfig.SUPABASE_URL is
# blank in every APK this workflow produces: the app still compiles, but
# sign-in, backup/restore, and Strava/Polar Connect all silently no-op —
# StravaAuthClient.canAttemptConnect and PolarClient.canAttemptConnect
# both fall back to (CLIENT_ID.isNotBlank() || SUPABASE_URL.isNotBlank()),
# so a missing SUPABASE_URL removes their only other path to working when
# STRAVA_CLIENT_ID / POLAR_CLIENT_ID aren't set either.
# ─────────────────────────────────────────────────────────────────────────────
#
# HUAWEI SIGN-IN. Two separate failure modes, two separate fixes — see
# HUAWEI_SIGNIN_SETUP.md for the full runbook:
#
#  1. "...isn't available — this app build was compiled without a Huawei
#     config": the AGC config never reached the build. Huawei sign-in AND
#     Huawei IAP are both dead in that APK. The "Check Huawei AGC config is
#     present" step below warns when the AGCONNECT_SERVICES_JSON_BASE64
#     secret is missing. Add it (base64 -w0 of agconnect-services.json).
#
#  2. Sign-in opens then INSTANTLY closes, no error: a config IS bundled, so
#     this is a console-side problem — either the SHA-256 certificate
#     fingerprint of the APK THIS workflow signed isn't registered against
#     the app in AppGallery Connect (Console -> your project -> your app ->
#     App information -> SHA-256 certificate fingerprint), or Account Kit is
#     not enabled under AppGallery Connect -> Build -> Account Kit. The
#     "Print release signing SHA-256" step prints the exact fingerprint this
#     run used — copy it from the Actions log into AppGallery Connect.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

# Cancel older in-progress runs for the same branch/PR to save minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # AGP 8.13 requires JDK 17 to run Gradle.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # Do NOT let this action use its default package list. The default is
        # `tools platform-tools`, and Google has REMOVED the legacy `tools`
        # package from the SDK repository. `sdkmanager tools` now exits 1 with
        # "Warning: Failed to find package 'tools'", which fails this step and
        # skips every later step — including the build itself, so the run goes
        # red in ~15s having never compiled anything. Pinning the list to
        # `platform-tools` keeps the action's license acceptance and SDK
        # setup while avoiding the vanished package; the platform the project
        # actually compiles against is installed in the next step.
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK platform and build-tools
        # compileSdk/targetSdk are 36 (see app/build.gradle.kts) and AGP is
        # 8.13.2, so the project needs platforms;android-36 and a matching
        # build-tools. Installed explicitly rather than through the action's
        # package list so the versions stay visible here and a future change
        # to the `sdkmanager` repository can't silently leave the platform
        # missing again. build-tools is allowed to be absent: AGP provisions
        # its own default automatically once the licenses are accepted.
        run: |
          sdkmanager --install "platforms;android-36" "platform-tools"
          sdkmanager --install "build-tools;36.0.0" \
            || echo "::warning::build-tools 36.0.0 not installable; AGP will provision its default."

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Check signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required signing secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "See the setup notes at the top of .github/workflows/build.yml."
            exit 1
          fi
          echo "All signing secrets present."

      - name: Check backend secrets are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_ANON_KEY" ] && missing="$missing SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Missing backend secret(s):$missing — this build's APK will have sign-in, backup/restore, and Strava/Polar Connect all silently no-op (BuildConfig.SUPABASE_URL will be blank)."
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "Values: Supabase dashboard -> Project Settings -> API (Project URL / anon key) — NOT the Edge Function Secrets page."
          else
            echo "Backend secrets present."
          fi

      - name: Check Huawei AGC config is present
        # Huawei sign-in and Huawei IAP both need agconnect-services.json bundled
        # in the APK. It carries live credentials, so it is NOT in git — it must
        # be supplied here. Without it the APK builds and installs fine, but
        # "Sign in with HUAWEI ID" reports that the build has no Huawei config
        # and every IAP call fails — both of which look like app bugs rather
        # than a missing build input, which is why this warns loudly.
        env:
          AGCONNECT_SERVICES_JSON_BASE64: ${{ secrets.AGCONNECT_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$AGCONNECT_SERVICES_JSON_BASE64" ]; then
            echo "::warning::Missing AGCONNECT_SERVICES_JSON_BASE64 — this build's APK will have NO Huawei config: 'Sign in with HUAWEI ID' will be unavailable and Huawei IAP calls will fail (error 60002). Email sign-in still works."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            echo "Value: base64 -w0 of your android/app/agconnect-services.json (AppGallery Connect -> Project settings -> General information -> App information -> download the config file)."
            echo "See HUAWEI_SIGNIN_SETUP.md."
          else
            echo "Huawei AGC config secret present."
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Print release signing SHA-256 (for AppGallery Connect / Huawei sign-in)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        # This is the exact fingerprint AppGallery Connect must have on file
        # for "Sign in with HUAWEI ID" to work in the APK this run produces.
        # It is not secret — it's meant to be public/registered — so it's
        # safe to print in the log. keytool ships with the JDK set up above.
        # Grep case-insensitively for "sha256" instead of matching an exact
        # header line: keytool's -list -v output wording has changed across
        # JDK versions, but the "SHA256:"/"SHA-256:" fingerprint line itself
        # has stayed put.
        run: |
          echo "Copy the SHA-256 value below into AppGallery Connect ->"
          echo "your app -> App information -> SHA-256 certificate fingerprint:"
          keytool -list -v \
            -keystore app/release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -i "sha256"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # JVM unit tests for the pure scheduling and message logic, run BEFORE the
      # (much slower) release build so a broken rule fails in ~1 minute instead
      # of after a full assemble. These need no signing secrets, no keystore and
      # no Huawei config: they exercise `HabitRepeat`, `legacyAlarmTimes`,
      # `Habit`'s serialized field names and `MotivationalMessages`, none of
      # which touch an Android class. They were the missing P1-3 coverage — a
      # bug in the day-of-week maths or the per-alarm message rotation is now
      # caught here rather than on a user's phone at 07:00.
      #
      # ── Why this step passes explicit memory flags ────────────────────────
      # It is the ONLY Gradle invocation in this workflow that did not, and that
      # is exactly why it was the only one that failed. `gradle.properties`
      # budgets `org.gradle.jvmargs=-Xmx3g` plus `kotlin.daemon.jvmargs=-Xmx2g`
      # — 5 GB of JVM heap — with `org.gradle.parallel=true` on top. The release
      # build below overrides that down to `-Xmx4g`; this step inherited the
      # full 5 GB and the runner's OOM killer took the daemon out mid-compile.
      #
      # The failure mode is worth spelling out, because it does not look like an
      # out-of-memory kill. The daemon dies while compiling, so Gradle never
      # reaches the test task, so no JUnit XML is ever written — and the "Upload
      # unit test reports" step below then reports "No files were found with the
      # provided path: android/app/build/reports/tests/ ... test-results/". The
      # run reads as a failing test suite when in fact no test ever ran, and the
      # whole job finishes in ~35s, which is far too fast for a real suite.
      #
      # The flags are the ones this project already verified locally — see
      # verification/v12-meta.txt, which records 19 suites / 285 tests / 0
      # failures with exactly these values — so this is a known-good
      # configuration rather than a guess. `-Pkotlin.compiler.execution.strategy=
      # in-process` keeps the Kotlin compiler inside the Gradle daemon instead of
      # forking a second multi-GB JVM, and `-Dorg.gradle.workers.max=1` stops
      # parallel workers from multiplying the peak. The heap is raised from the
      # verified 768m to 2g for headroom over the code Phase 1 added, while
      # staying well inside the ~7 GB runner.
      #
      # `-Porg.gradle.configuration-cache=false` mirrors the release step, whose
      # own comment says it disables the configuration cache "to avoid flaky CI
      # failures". `gradle.properties` turns it ON, and the test step never
      # overrode it — the one remaining difference from the invocation that has
      # always worked on CI.
      - name: Run unit tests
        # The output is teed to a file and, on failure, the key lines are
        # re-emitted as `::error::` annotations. That is deliberate: the job log
        # itself requires an authenticated session to read, while annotations are
        # readable through the public API — so a failure here is diagnosable
        # without signing in. `set -o pipefail` keeps Gradle's exit code as the
        # step's exit code despite the pipe into `tee`.
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon --no-parallel \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Porg.gradle.configuration-cache=false \
            -Dorg.gradle.workers.max=1 2>&1 | tee /tmp/unit-tests.log
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Unit tests failed with exit $status — key lines follow"
            grep -E "^e: |error:|FAILED|What went wrong|Caused by|Execution failed|Could not resolve|Unresolved reference|OutOfMemory|Killed" \
              /tmp/unit-tests.log | head -40 | while IFS= read -r line; do
                echo "::error::$line"
              done
          fi
          exit "$status"

      - name: Upload unit test reports
        # Runs even when the tests fail, so the failure is diagnosable from the
        # JUnit XML rather than from the console log alone.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          retention-days: 14

      - name: Build release APK
        env:
          # The app's signingConfig reads these three from the environment.
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Backend connectivity — read by build.gradle.kts (resolveRorkValue)
          # and baked into BuildConfig.SUPABASE_URL / SUPABASE_ANON_KEY. This
          # was previously missing from this step entirely, so every APK this
          # workflow built had it blank — see the "REQUIRED" note at the top
          # of this file for what that silently breaks.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Activity-sync OAuth client identifiers — read by build.gradle.kts
          # (resolveRorkValue) and baked into BuildConfig. Without these the
          # Strava/Polar "Connect" buttons compile fine but silently no-op
          # (PolarClient.isConfigured / Strava's equivalent check is false),
          # because CLIENT_ID/CLIENT_SECRET fall back to blank strings.
          # Add STRAVA_CLIENT_ID and POLAR_CLIENT_ID
          # as repository secrets (Settings -> Secrets and variables ->
          # Actions) to enable these integrations in CI-built APKs — same
          # values as the Supabase Edge Function secrets of the same name.
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          POLAR_CLIENT_ID: ${{ secrets.POLAR_CLIENT_ID }}
          # Huawei AGC config — read by build.gradle.kts (see the "How
          # agconnect-services.json reaches the build" block) and bundled into
          # the APK assets, which is what lets HUAWEI ID sign-in and Huawei IAP
          # work in the APK this workflow produces. Passed as base64 because
          # the JSON is multi-line. Absent, the build still succeeds but logs a
          # loud warning and ships an APK with Huawei sign-in disabled.
          AGCONNECT_SERVICES_JSON_BASE64: ${{ secrets.AGCONNECT_SERVICES_JSON_BASE64 }}
        # CI-only overrides (GitHub runners have ~7 GB): cap the Gradle JVM and
        # turn off the configuration cache to avoid flaky CI failures. This does
        # NOT change any committed files.
        run: >-
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          -Porg.gradle.configuration-cache=false

      - name: Remove decoded keystore
        # Never leave the keystore lying around on the runner.
        if: always()
        run: rm -f app/release.keystore

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore
          retention-days: 7
