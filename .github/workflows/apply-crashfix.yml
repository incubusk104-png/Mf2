name: Apply crashfix

# ONE-SHOT applier. Lives only on the throwaway `crashfix-apply` branch and
# deletes itself as part of the commit it pushes to `main`, so it can never
# re-fire and overwrite the fix it just landed.
on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download, verify and overlay the payload
        env:
          PAYLOAD_URL: "https://static.teamily.ai/sites/ca636d4d-36c6-4407-9059-24fdbab23b20/documents/mf2_crashfix_v2/mf2_crashfix.zip"
          PAYLOAD_SHA256: "4dcc3705e6ffadc818652fcf8778be19c10f10ff14830c0de5e54807e3e3c3cd"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/upd.zip "$PAYLOAD_URL"
          echo "$PAYLOAD_SHA256  /tmp/upd.zip" | sha256sum -c -
          rm -rf /tmp/upd && mkdir -p /tmp/upd
          unzip -q /tmp/upd.zip -d /tmp/upd
          test -f /tmp/upd/android/app/src/main/java/com/rork/mindsetframestracker/notifications/AlarmStopReceiver.kt
          cp -a /tmp/upd/. .
          echo "=== overlaid files ==="
          git status --short

      - name: Compile gate
        run: |
          set +e
          cd android
          chmod +x ./gradlew
          ./gradlew :app:compileReleaseKotlin --console=plain --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            -Porg.gradle.configuration-cache=false > /tmp/compile.log 2>&1
          echo "exit=$?" > /tmp/gate.txt
          grep -E "^e: " /tmp/compile.log | head -100 >> /tmp/gate.txt
          grep -E "Unresolved reference|Cannot infer|error:|Execution failed" /tmp/compile.log | head -100 >> /tmp/gate.txt
          echo "=== gate ==="
          cat /tmp/gate.txt

      - name: Publish gate result and commit if green
        run: |
          set -euo pipefail
          GATE_LINE=$(head -1 /tmp/gate.txt)
          echo "gate reports: $GATE_LINE"
          GATE_EXIT=$(echo "$GATE_LINE" | sed 's/exit=//')
          git config user.name "teamily-agent"
          git config user.email "agent@teamily.ai"

          if [ "$GATE_EXIT" != "0" ]; then
            cp /tmp/gate.txt gate-result.txt
            git checkout -B crashfix-gate-result
            git add -f gate-result.txt
            git commit -m "Compile gate diagnostics (compile FAILED)"
            git push -f origin crashfix-gate-result
            echo "::error::compile gate failed, see crashfix-gate-result"
            exit 1
          fi

          git rm -f .github/workflows/apply-crashfix.yml
          git rm -f .github/workflows/apply-ringfix.yml
          git rm -f probe_result.txt
          git rm -f .ci-error.txt
          git add -A
          echo "=== staged ==="
          git status --short
          git commit \
            -m "Fix the alarm-ring crash; add manual Stop alarm; capture real activity data" \
            -m "Ring-path crash fixes:" \
            -m "- AlarmRingService registered its onPrepared listener AFTER setDataSource, inside a block whose last call is prepareAsync(). setDataSource resolves the ringtone through the content resolver and prepareAsync can complete synchronously, so onPrepared could fire before the listener existed: start() was never called and the alarm silently made no sound. The listener is now registered first, the player is published before preparing, and a @Volatile released latch makes a late callback decline instead of calling start() on a released player." \
            -m "- AlarmRingService.onDestroy now cancels the ongoing ring notification. stopSelf() does not clear a foreground notification, so the alarm kept looking like it was still ringing after every stop path had run." \
            -m "- The ring screen's primary action is now a real Stop alarm that stops the MediaPlayer, cancels the repeating vibration, tears down the service and clears both notifications, instead of a plain finish()." \
            -m "Manual Stop alarm:" \
            -m "- New AlarmStopReceiver (guarded broadcast, registered in the manifest) is the single stop entry point." \
            -m "- Stop alarm action added to the habit ring notification, the timer completion notification, and the ongoing Alarm ringing notification, so an alarm can be silenced from the shade without unlocking the phone or depending on the full-screen-intent grant." \
            -m "Real activity monitoring for the sports habits:" \
            -m "- New ActivityMonitor reads the device's own Health Connect store over the activity window: ExerciseSessionRecord for duration, plus DistanceRecord, TotalCaloriesBurnedRecord and HeartRateRecord aggregates alongside the existing steps." \
            -m "- Records are honestly partial: a metric no source provided stays null and is reported as not recorded, never fabricated." \
            -m "- The report sheet names the new source and states plainly when heart rate or distance was not recorded."
          git push origin HEAD:main
          echo "pushed to main"
