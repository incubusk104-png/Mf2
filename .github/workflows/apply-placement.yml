name: Apply timer placement payload
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download, verify and unpack
        env:
          PAYLOAD_URL: "https://static.teamily.ai/files/a45f42cb-9bd8-4000-a0ac-452b54d3fc4a/payload_placement.zip"
          PAYLOAD_SHA256: "aaf4e4ecd8775b06f63a4aa8c567b418d9277b04311a2a60fbe7ad92e1988636"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/upd.zip "$PAYLOAD_URL"
          echo "$PAYLOAD_SHA256  /tmp/upd.zip" | sha256sum -c -
          mkdir -p /tmp/upd && unzip -q /tmp/upd.zip -d /tmp/upd
          test -d /tmp/upd/mf2_placement
          cp -a /tmp/upd/mf2_placement/. .
          rm -f .github/workflows/apply-placement.yml
          git status --short
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "incubusk104-png"
          git config user.email "incubusk104@gmail.com"
          git add -A
          git commit -m "Move timer and stopwatch entry point from Home to Habits screen" -m "The walk timer / stopwatch card no longer sits on the Today screen under the header. Today is the daily check-in surface (mood, prompt, quote, habit checklist); a timer card embedded in it read as a stray widget." -m "- HomeScreen no longer takes an onOpenTimer parameter and renders no timer UI" -m "- TimerEntryCard now renders in the Habits screen header, next to the tracking content it belongs to" -m "- AppNavigation wires onOpenTimer through the habits route instead of home" -m "- ALARM_REPORT.md updated with the new placement and a note on the move" -m "The timer route, the alarm/service wiring and the persisted one-time completion popup are untouched: the popup host still sits above the NavHost, so it fires once per event wherever the user is."
          git push origin HEAD:main
          echo "PUSHED_SHA=$(git rev-parse HEAD)"
