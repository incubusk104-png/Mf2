name: apply
on: push
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          URL: https://static.teamily.ai/sites/ca636d4d-36c6-4407-9059-24fdbab23b20/documents/mf2_ringfix4/mf2_ringfix_v4.zip?tk=c2l0ZTpjYTYzNmQ0ZC0zNmM2LTQ0MDctOTA1OS0yNGZkYmFiMjNiMjAvZG9jdW1lbnRzL21mMl9yaW5nZml4NDoxNzg5Mzk1Njcz.MTk3YTM2MTMwMzg1YTZlOGVjODY1MzgzZGM5MDUwMmM
          SHA: 8c8c131bdf4fbb66f1b4cc3ecd9b079e9a242855c9a136ccd68ae11a4132c71f
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/u.zip "$URL"
          echo "$SHA  /tmp/u.zip" | sha256sum -c -
          unzip -q /tmp/u.zip -d /tmp/u
          bash /tmp/u/apply.sh
