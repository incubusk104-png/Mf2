name: Land the export + habit-sharing feature

# One-shot landing workflow. Thin wrapper: it fetches land-reporting.sh (the
# logic) and runs it. It exists on the scratch branch `verify/reporting-export`
# only, and the landing commit deletes both files, so it never reaches main.
#
# Why a runner at all: the dev sandbox has a hard 2 GiB cgroup memory limit while
# gradle.properties requests -Xmx3g for Gradle PLUS -Xmx2g for the Kotlin daemon,
# so the build daemon is OOM-killed during compilation. Measured, not assumed.
#
# The script compiles AND runs the unit tests (`:app:testDebugUnitTest` does
# both) BEFORE it pushes, so a red tree cannot land.

on:
  push:
    branches: ["verify/reporting-export"]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  land:
    name: Apply, test, then land
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Fetch the landing script and show its digest
        run: |
          set -euo pipefail
          URL="https://static.teamily.ai/files/956e51c5-7b75-46bd-b7c5-f0be5727be28/land-reporting.sh"
          echo "url: $URL"
          curl -fsSL "$URL" -o /tmp/land.sh
          echo "sha256: $(sha256sum /tmp/land.sh | cut -d' ' -f1)"
          echo "bytes:  $(wc -c < /tmp/land.sh)"
          echo "--- first line ---"
          head -1 /tmp/land.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The DEFAULT package list for setup-android is "tools platform-tools", and
      # Google REMOVED the legacy `tools` package: `sdkmanager tools` exits 1,
      # failing this step in ~15s and silently skipping every later step - the run
      # goes red having compiled nothing. Always pin packages explicitly.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK platform and build-tools
        run: |
          sdkmanager --install "platforms;android-36" "platform-tools"
          sdkmanager --install "build-tools;36.0.0" \
            || echo "::warning::build-tools 36.0.0 not installable."

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-reporting-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-reporting-${{ runner.os }}-

      - name: Run the landing script
        run: |
          set -o pipefail
          bash /tmp/land.sh 2>&1 | tee /tmp/land.out

      # The script posts a status for the two outcomes it can describe (a gradle
      # failure and a success). This covers everything earlier - a patch digest
      # mismatch, a failed apply, a failed assertion - so the verdict is readable
      # without the job log, which needs admin rights.
      - name: Publish a failure status
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          line=$(grep -m1 '::error::' /tmp/land.out 2>/dev/null | sed 's/.*::error:://' | cut -c1-100)
          [ -n "$line" ] || line="the landing script failed - see the job log"
          if [ -z "$(curl -sS -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" \
                | python3 -c "import sys,json; d=json.load(sys.stdin); print([s['context'] for s in d.get('statuses',[])] if d.get('state')!='pending' else [])" 2>/dev/null)" ]; then
            curl -sS -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -d "{\"state\":\"failure\",\"context\":\"land-reporting\",\"description\":\"$line\"}" >/dev/null || true
          fi
          echo "reported: $line"

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== script output (tail) ==="
          tail -60 /tmp/land.out 2>/dev/null || echo "(no output captured)"
          echo
          echo "=== worktree ==="
          git -C "$GITHUB_WORKSPACE" status --porcelain | head -40
          echo
          echo "=== test log tail ==="
          tail -40 /tmp/test.log 2>/dev/null || echo "(no test log)"
