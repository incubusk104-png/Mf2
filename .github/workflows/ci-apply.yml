name: ci-apply-notifier-fix
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detach HEAD so a failure leaves main untouched
        run: git checkout --detach
      - name: Download, verify and overlay payload
        env:
          PAYLOAD_URL: "https://static.teamily.ai/files/8a1e173b-f8bb-4570-88cd-7094e120968b/timer_fix_payload_v3.zip"
          PAYLOAD_SHA256: "6bc723b5a3aa744304955e679440e0ca5f3eb8c10fdc5d97c940d16733034547"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/fix.zip "$PAYLOAD_URL"
          echo "$PAYLOAD_SHA256  /tmp/fix.zip" | sha256sum -c -
          mkdir -p /tmp/fx && unzip -q /tmp/fix.zip -d /tmp/fx
          test -f /tmp/fx/Upd_v3/android/app/src/main/java/com/rork/mindsetframestracker/notifications/TimerNotifier.kt
          cp -a /tmp/fx/Upd_v3/. .
          git status --short
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Compile release Kotlin (the gate)
        run: |
          set -euo pipefail
          cd android
          chmod +x ./gradlew
          ./gradlew :app:compileReleaseKotlin --no-daemon
      - name: Commit and push only because it compiled
        run: |
          set -euo pipefail
          git config user.name "Mobile App Builder"
          git config user.email "agent@teamily.ai"
          git add android/app/src/main/java/com/rork/mindsetframestracker/notifications/TimerNotifier.kt android/app/src/main/java/com/rork/mindsetframestracker/notifications/HabitCheckInNotifier.kt
          git commit -m "Restore TimerNotifier ring helpers; fix habit channel audio-attributes" -m "- A stale payload push had reverted TimerNotifier.kt to its pre-828bfd9 state, deleting eventFromIntent/ringTitle/ringSubtitle which AlarmRingingActivity calls. Restored, plus the runId extra wiring for popup provenance." -m "- HabitCheckInNotifier called channel.setAudioAttributes(...), which does not exist on NotificationChannel (get-only API). The usage is now declared in the NotificationChannel constructor instead, which makes the channel DND-alarm eligible exactly as intended."
          git push origin HEAD:main
      - name: Remove this temporary workflow from main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup origin/main
          git rm -q .github/workflows/ci-apply.yml .github/workflows/ci-diag.yml || true
          git commit -m "Remove temporary CI workflows" || echo "nothing to clean"
          git push origin HEAD:main
      - name: Show result
        run: git log -1 --format=%H
