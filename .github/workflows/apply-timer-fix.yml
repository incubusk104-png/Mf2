name: apply-timer-popup-fix
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download, verify and unpack
        env:
          PAYLOAD_URL: "https://static.teamily.ai/files/56f06e57-3e0d-48ad-8504-2db8014cea37/timer_popup_fix_payload.zip"
          PAYLOAD_SHA256: "1c9401c661d448e8d98e05416b7028af1a29b22acb5be825ddfaf6a3b1878b5b"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/upd.zip "$PAYLOAD_URL"
          echo "$PAYLOAD_SHA256  /tmp/upd.zip" | sha256sum -c -
          mkdir -p /tmp/upd && unzip -q /tmp/upd.zip -d /tmp/upd
          test -f /tmp/upd/Upd/ALARM_REPORT.md
          cp -a /tmp/upd/Upd/. .
          rm -f .github/workflows/apply-timer-fix.yml
          git status --short
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Mobile App Builder"
          git config user.email "agent@teamily.ai"
          git add -A
          git commit -m "Gate walk-timer popup on a real started run; move timer entry off Today" -m "- Popup requires provenance: a completion must name a run id present in the started-run ledger (TimerRepository.wasRunStarted). recordCompletion rejects an event with no started run behind it (new RecordOutcome.Rejected), and the popup host reads through loadPopupEvent, which discards orphaned/legacy pending events. Opening the app can never raise a walk-complete popup for a walk that was never set." -m "- Add TIMER_POPUP_GRACE_MILLIS (30 min): a completion stranded by a crash or force-stop expires instead of ambushing the user later; the result still arrives as a notification." -m "- TimerCompletionEvent gains runId; TimerCompletion.start() records the session before anything can complete, so an event can never outrun its own start." -m "- Reminder receiver is gated the same way, so it cannot nudge for an ineligible event." -m "- One-time behaviour unchanged: atomic claim in recordCompletion plus the append-only handled ledger, consumed on show. Still fires once per event and never on re-render, resume, navigation or reboot." -m "- Move the Walk timer and stopwatch entry card from Today to Habits so Today stays a pure daily check-in; HomeScreen drops onOpenTimer, HabitsScreen gains it." -m "- Stopwatch and the other timer kinds are unaffected."
          git push origin HEAD:main
      - name: Show result
        run: git log -1 --format=%H
