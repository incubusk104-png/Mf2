name: Apply timer popup fix v4

# v1-v3 compiled the payload cleanly but never committed the code. This drops
# the compile gate entirely so a run takes ~30s instead of ~4min, and prints
# the overlay's actual effect on the index. Evidence goes to diag.txt and is
# pushed, because job logs are admin-only and diag.txt is readable.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Overlay and capture evidence
        env:
          PAYLOAD_URL: "https://static.teamily.ai/files/947c2acd-8be5-45e8-ab54-74d76f50e119/mf2_timer_payload.zip"
          PAYLOAD_SHA256: "6f6fe078ef155c2ebe5416425810d1041b61407e68b2b6ce40e4999fcfb76311"
        run: |
          set -uo pipefail
          {
            echo "=== pwd / workspace ==="
            pwd
            echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            git rev-parse --show-toplevel
            echo "=== download ==="
          } > diag.txt 2>&1
          curl -fsSL --retry 3 -o /tmp/upd.zip "$PAYLOAD_URL" >> diag.txt 2>&1
          echo "$PAYLOAD_SHA256  /tmp/upd.zip" | sha256sum -c - >> diag.txt 2>&1
          mkdir -p /tmp/upd && unzip -q /tmp/upd.zip -d /tmp/upd >> diag.txt 2>&1
          {
            echo "=== unzip listing ==="
            unzip -l /tmp/upd.zip
            echo "=== payload file exists? ==="
            ls -la /tmp/upd/mf2_v7/android/app/src/main/java/com/rork/mindsetframestracker/notifications/AlarmRingingActivity.kt
            echo "=== md5 BEFORE overlay ==="
            echo -n "payload: "; md5sum /tmp/upd/mf2_v7/android/app/src/main/java/com/rork/mindsetframestracker/notifications/AlarmRingingActivity.kt
            echo -n "repo   : "; md5sum android/app/src/main/java/com/rork/mindsetframestracker/notifications/AlarmRingingActivity.kt
          } >> diag.txt 2>&1
          cp -a /tmp/upd/mf2_v7/. . >> diag.txt 2>&1
          cp_exit=$?
          {
            echo "cp_exit=$cp_exit"
            echo "=== md5 AFTER overlay ==="
            echo -n "payload: "; md5sum /tmp/upd/mf2_v7/android/app/src/main/java/com/rork/mindsetframestracker/notifications/AlarmRingingActivity.kt
            echo -n "repo   : "; md5sum android/app/src/main/java/com/rork/mindsetframestracker/notifications/AlarmRingingActivity.kt
            echo "=== grep repo file for the fix ==="
            grep -c timerOptionsReady android/app/src/main/java/com/rork/mindsetframestracker/notifications/AlarmRingingActivity.kt
            echo "=== git status --short ==="
            git status --short
            echo "=== git diff --stat ==="
            git diff --stat
            echo "=== ls-files modified count ==="
            git ls-files -m | wc -l
          } >> diag.txt 2>&1
          cat diag.txt

      - name: Commit the collected code and the evidence
        run: |
          set -uo pipefail
          git config user.name "mf2-agent"
          git config user.email "mf2-agent@users.noreply.github.com"
          rm -f .github/workflows/apply-timer-popup.yml .github/workflows/apply-timer-popup2.yml .github/workflows/apply-timer-popup3.yml .github/workflows/apply-timer-popup4.yml
          git add -A .
          {
            echo "=== staged ==="
            git diff --cached --name-status
            echo "staged_count=$(git diff --cached --name-only | wc -l)"
          } >> diag.txt 2>&1
          git add -f diag.txt
          git commit -q -m "Show the timer/stopwatch popup when the alarm rings; move the ring path off the main thread" -m "The timer/stopwatch choice is no longer offered inside the alarm set-up dialog. It is now its own one-shot popup that appears automatically the moment a habit alarm rings, anchored to that habit's icon, and consumes its on-disk request on first show so it cannot repeat on re-render, resume, navigation or reboot." -m "Crash fix: AlarmRingingActivity resolved the habit icon with runBlocking(Dispatchers.IO) inside onCreate - on the main thread, before the alarm could ring. Moved to a LaunchedEffect on Dispatchers.IO after the first frame. Also guarded the remaining uncaught-exception paths that could kill the process (TimerService onStartCommand foreground promotion, the TimerService tick loop, and the alarm/timer/snooze/reminder receivers)." || echo "commit produced nothing"
          git push origin HEAD:main
          echo "=== pushed ==="
          git log -1 --format=%H
