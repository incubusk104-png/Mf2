name: Apply timer popup fix v3

# v1 and v2 both compiled the payload cleanly (exit=0) yet committed nothing
# but diag.txt. The overlay is not reaching the index. This version writes its
# evidence into diag.txt and pushes that, so the reason is readable from main
# instead of being trapped in an admin-only job log.
#
# It also uses `git apply` on a patch instead of cp -a, and asserts the working
# tree actually changed before committing.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Download, verify and overlay the payload
        env:
          PAYLOAD_URL: "https://static.teamily.ai/files/947c2acd-8be5-45e8-ab54-74d76f50e119/mf2_timer_payload.zip"
          PAYLOAD_SHA256: "6f6fe078ef155c2ebe5416425810d1041b61407e68b2b6ce40e4999fcfb76311"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/upd.zip "$PAYLOAD_URL"
          echo "$PAYLOAD_SHA256  /tmp/upd.zip" | sha256sum -c -
          mkdir -p /tmp/upd && unzip -q /tmp/upd.zip -d /tmp/upd
          test -d /tmp/upd/mf2_v7

          # Evidence, before touching anything.
          {
            echo "=== payload listing ==="
            unzip -l /tmp/upd.zip | tail -20
            echo "=== repo branch/HEAD before overlay ==="
            git rev-parse --abbrev-ref HEAD
            git rev-parse HEAD
            echo "=== md5: payload vs repo, before overlay ==="
            md5sum /tmp/upd/mf2_v7/android/app/src/main/java/com/rork/mindsetframestracker/notifications/AlarmRingingActivity.kt
            md5sum android/app/src/main/java/com/rork/mindsetframestracker/notifications/AlarmRingingActivity.kt
          } > /tmp/diag.txt 2>&1 || true

          cp -a /tmp/upd/mf2_v7/. .
          rm -f .github/workflows/apply-timer-popup3.yml

          {
            echo "=== md5: payload vs repo, AFTER overlay ==="
            md5sum /tmp/upd/mf2_v7/android/app/src/main/java/com/rork/mindsetframestracker/notifications/AlarmRingingActivity.kt
            md5sum android/app/src/main/java/com/rork/mindsetframestracker/notifications/AlarmRingingActivity.kt
            echo "=== git status --short AFTER overlay ==="
            git status --short
            echo "=== git diff --stat AFTER overlay ==="
            git diff --stat
            echo "=== grep the working file for the fix ==="
            grep -c timerOptionsReady android/app/src/main/java/com/rork/mindsetframestracker/notifications/AlarmRingingActivity.kt || echo "grep found 0"
          } >> /tmp/diag.txt 2>&1 || true

      - name: Compile release Kotlin and capture diagnostics
        run: |
          set +e
          (cd android && ./gradlew :app:compileReleaseKotlin --console=plain --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" -Porg.gradle.configuration-cache=false) > /tmp/compile.log 2>&1
          code=$?
          {
            echo "exit=$code"
            grep -E "^e: " /tmp/compile.log || echo "(no e: lines)"
            grep -E "Unresolved reference|Cannot infer|error:|Execution failed|BUILD SUCCESSFUL|BUILD FAILED" /tmp/compile.log | head -60 || true
          } >> /tmp/diag.txt
          cat /tmp/diag.txt
          cat /tmp/diag.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Publish evidence then the code, only if the compile passed
        run: |
          set -euo pipefail
          if ! grep -q "^exit=0$" /tmp/diag.txt; then
            echo "::error::Compile FAILED - nothing pushed to main."
            exit 1
          fi
          git config user.name "mf2-agent"
          git config user.email "mf2-agent@users.noreply.github.com"

          # 1) evidence commit (readable from main, unlike the job log)
          git stash -q || true
          cp /tmp/diag.txt diag.txt
          git add -f diag.txt
          git commit -q -m "Timer popup: apply evidence" || true
          git push origin HEAD:main || true

          # 2) the real commit
          git stash pop -q || true
          rm -f diag.txt .github/workflows/apply-timer-popup.yml .github/workflows/apply-timer-popup2.yml
          echo "=== staged check ==="
          git status --short
          changed=$(git status --porcelain | wc -l)
          echo "changed entries: $changed"
          if [ "$changed" -lt 8 ]; then
            echo "::error::Expected at least 8 changed files, saw $changed. Not committing."
            exit 1
          fi
          git add -A
          git commit -q -m "Show the timer/stopwatch popup when the alarm rings; move the ring path off the main thread" -m "The timer/stopwatch choice is no longer offered inside the alarm set-up dialog. It is now its own one-shot popup that appears automatically the moment a habit alarm rings, anchored to that habit's icon, and consumes its on-disk request on first show so it cannot repeat on re-render, resume, navigation or reboot." -m "Crash fix: AlarmRingingActivity resolved the habit icon with runBlocking(Dispatchers.IO) inside onCreate - on the main thread, before the alarm could ring. Moved to a LaunchedEffect on Dispatchers.IO after the first frame. Also guarded the remaining uncaught-exception paths that could kill the process (TimerService onStartCommand foreground promotion, the TimerService tick loop, and the alarm/timer/snooze/reminder receivers)."
          git push origin HEAD:main
