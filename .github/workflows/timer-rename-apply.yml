name: Timer rename apply
on:
  push:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: timer-rename-apply
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch to main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - name: Download and verify payload
        env:
          PAYLOAD_BASE: "https://static.teamily.ai/sites/ca636d4d-36c6-4407-9059-24fdbab23b20"
          PAYLOAD_PATH: "/documents/mf2_timer_payload/mf2_timer_payload.zip"
          PAYLOAD_SHA256: "5ad18f6b1ea7e395437ad46a7e589c4d33d3ba79a06161a5da99d9a4aa9f0212"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/upd.zip "${PAYLOAD_BASE}${PAYLOAD_PATH}"
          echo "$PAYLOAD_SHA256  /tmp/upd.zip" | sha256sum -c -
          mkdir -p /tmp/upd && unzip -q /tmp/upd.zip -d /tmp/upd
          test -f /tmp/upd/Mf2-main/android/app/src/main/java/com/rork/mindsetframestracker/notifications/HabitTimerRequests.kt
          cp -a /tmp/upd/Mf2-main/. .
          git status --short
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-timer-rename-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-timer-rename-
      - name: Compile release Kotlin
        id: compile
        run: |
          set +e
          cd android
          chmod +x ./gradlew
          ./gradlew :app:compileReleaseKotlin --console=plain --no-daemon > /tmp/compile.log 2>&1
          EC=$?
          echo "compile_exit=$EC"
          echo "exit=$EC" > /tmp/diag.txt
          grep -E "^e: " /tmp/compile.log >> /tmp/diag.txt
          grep -E "Unresolved reference|Cannot infer|error:|Execution failed" /tmp/compile.log | head -150 >> /tmp/diag.txt
          tail -30 /tmp/compile.log >> /tmp/diag.txt
          if [ "$EC" != "0" ]; then
            echo "=== COMPILE FAILED (exit $EC) ==="
            grep -E "^e: " /tmp/compile.log | head -80
          else
            echo "=== COMPILE OK ==="
          fi
          exit $EC
      - name: Commit and push to main
        if: success()
        run: |
          set -euo pipefail
          git config user.name "mf2-agent"
          git config user.email "mf2-agent@users.noreply.github.com"
          git add -A
          git commit -m "Rename walk timer to timer; move timer/stopwatch into the habit icon popup" -m "The 'walk timer' is now simply the timer: TimerKind.WALK_TIMER -> TimerKind.TIMER, DEFAULT_WALK_TARGET_SECONDS -> DEFAULT_TARGET_SECONDS, and every user-visible label reads as a plain timer." -m "The timer/stopwatch options no longer live outside the habit icons. They are opened from inside the habit itself - its alarm dialog, or its alarm ringing - and the standalone entry banner is gone." -m "A habit alarm now leaves a one-shot request (HabitTimerRequests) that the Habits screen consumes exactly once, so the options appear once per ring and never on re-render, resume, navigation or reboot." -m "A finished habit timer queues an activity auto-sync that pulls from the connected app (Strava / Health Connect / Polar) on next resume." -m "The ringing screen now shows the habit's own catalog icon and offers the timers for that habit."
          git push origin main:main
      - name: Publish compile diagnostics
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          cp /tmp/diag.txt ./timer_rename_diag.txt
          git config user.name "mf2-agent"
          git config user.email "mf2-agent@users.noreply.github.com"
          git checkout -B timer-rename-diag
          git add -f timer_rename_diag.txt
          git commit -m "Timer rename compile diagnostics"
          git push -f origin timer-rename-diag
