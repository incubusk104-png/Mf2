name: Verify Huawei AGC config plumbing

# Throwaway verification workflow for the Huawei sign-in fix. Removed from
# main once the fix is confirmed; it is NOT part of the shipped pipeline.
#
# Proves, against a real Android SDK and a real APK:
#   1. a config supplied via AGCONNECT_SERVICES_JSON_BASE64 reaches the APK's
#      assets AND drives the manifest's com.huawei.hms.client.appid/cpid;
#   2. a build with NO config bundles no asset and invents no app identity
#      (i.e. the hardcoded fallbacks are really gone);
#   3. the config's client_secret / api_key never appear in the build log;
#   4. the Kotlin still compiles in both configurations.

on:
  push:
    branches: ["verify/huawei-signin-fix"]
  workflow_dispatch: {}

jobs:
  verify:
    name: Verify AGC config plumbing + compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK platform
        working-directory: .
        run: |
          sdkmanager --install "platforms;android-36" "platform-tools"
          sdkmanager --install "build-tools;36.0.0" \
            || echo "::warning::build-tools 36.0.0 not installable; AGP will provision its default."

      - name: Assert the hardcoded app_id / cp_id fallbacks are gone
        working-directory: .
        run: |
          set -e
          if grep -n "118642709" android/app/build.gradle.kts; then
            echo "::error::The hardcoded app_id fallback 118642709 is still present."
            exit 1
          fi
          if grep -n "30063000033888672" android/app/build.gradle.kts; then
            echo "::error::The hardcoded cp_id fallback is still present."
            exit 1
          fi
          echo "OK: no hardcoded Huawei app identity fallback remains."

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare a synthetic AGC config
        working-directory: .
        run: |
          set -e
          printf '%s' '{"client":{"app_id":"999000111","cp_id":"999000222","client_id":"999000333","client_secret":"SENTINEL_SECRET_DO_NOT_SHIP","api_key":"SENTINEL_API_KEY","package_name":"com.mindsetframes.habittracker"},"configuration_version":"3.0"}' \
            > /tmp/synthetic-agconnect.json
          echo "AGCONNECT_SERVICES_JSON_BASE64=$(base64 -w0 /tmp/synthetic-agconnect.json)" >> "$GITHUB_ENV"
          echo "Synthetic config prepared (identifiers fake; credential fields are sentinels)."

      # ── Case 1: a config IS supplied ──────────────────────────────────────
      - name: Case 1 — build WITH an injected AGC config
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            -Porg.gradle.configuration-cache=false 2>&1 | tee /tmp/gradle-with.log
          exit ${PIPESTATUS[0]}

      - name: Case 1 — assert the config reached the APK assets and the manifest
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep agconnect \
            || { echo "::error::agconnect-services.json is NOT in the APK assets"; exit 1; }
          unzip -p "$APK" assets/agconnect-services.json > /tmp/from-apk.json
          cat /tmp/from-apk.json
          grep -q "999000111" /tmp/from-apk.json \
            || { echo "::error::the injected app_id did not reach the bundled asset"; exit 1; }
          echo "OK: injected config reached the APK assets."

          echo "--- merged manifest carrying the Huawei meta-data ---"
          MF=$(grep -rl "com.huawei.hms.client.appid" \
                 $(find app/build/intermediates -name 'AndroidManifest.xml' -path '*debug*') \
               | head -1 || true)
          if [ -z "$MF" ]; then
            echo "::error::No merged manifest declares com.huawei.hms.client.appid"
            exit 1
          fi
          echo "manifest: $MF"
          grep -n "com.huawei.hms.client" "$MF"
          grep -q "appid=999000111" "$MF" \
            || { echo "::error::manifest appid does not match the injected config"; exit 1; }
          grep -q "cpid=999000222" "$MF" \
            || { echo "::error::manifest cpid does not match the injected config"; exit 1; }
          echo "OK: manifest appid/cpid came from the injected config, not a literal."

      - name: Case 1 — assert no AGC secret value was logged
        run: |
          set -e
          if grep -q "SENTINEL_SECRET_DO_NOT_SHIP" /tmp/gradle-with.log; then
            echo "::error::client_secret leaked into the Gradle log"
            exit 1
          fi
          if grep -q "SENTINEL_API_KEY" /tmp/gradle-with.log; then
            echo "::error::api_key leaked into the Gradle log"
            exit 1
          fi
          echo "OK: no AGC secret value appears in the build log."
          echo "--- the resolution line the build printed ---"
          grep -i "Huawei AGC config resolved from" /tmp/gradle-with.log || echo "(none found)"

      # ── Case 2: NO config is supplied ─────────────────────────────────────
      - name: Case 2 — build WITHOUT any AGC config
        run: |
          ./gradlew :app:clean --no-daemon -Porg.gradle.configuration-cache=false || true
          env -u AGCONNECT_SERVICES_JSON -u AGCONNECT_SERVICES_JSON_BASE64 \
            ./gradlew :app:assembleDebug --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            -Porg.gradle.configuration-cache=false 2>&1 | tee /tmp/gradle-without.log
          exit ${PIPESTATUS[0]}

      - name: Case 2 — assert an unconfigured build ships no Huawei identity
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $APK"
          if unzip -l "$APK" | grep -q agconnect-services.json; then
            echo "::error::A config-less build still bundled agconnect-services.json (stale asset not cleaned)"
            exit 1
          fi
          echo "OK: no config bundled in a config-less build."

          echo "--- manifest must not invent an app identity ---"
          for MF in $(find app/build/intermediates -name 'AndroidManifest.xml' -path '*debug*'); do
            grep -n "com.huawei.hms.client" "$MF" || true
            if grep -q "appid=118642709" "$MF"; then
              echo "::error::The stale hardcoded appid=118642709 was still injected"
              exit 1
            fi
            if grep -q "appid=999000111" "$MF"; then
              echo "::error::A config-less build still carries the previous config's app id"
              exit 1
            fi
          done
          echo "OK: no app identity invented for a config-less build."

          echo "--- a config-less build must warn loudly ---"
          grep -q "HUAWEI SIGN-IN WILL BE DISABLED IN THIS BUILD" /tmp/gradle-without.log \
            || { echo "::error::No warning was printed for a config-less build"; exit 1; }
          echo "OK: config-less build warned loudly."

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: |
            /tmp/gradle-with.log
            /tmp/gradle-without.log
          if-no-files-found: ignore
          retention-days: 7
