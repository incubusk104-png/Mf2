name: Cleanup after timer popup fix

# Removes two leftovers from main and then deletes itself:
#
#  - diag.txt: the evidence file the apply workflows pushed, because GitHub job
#    logs are admin-only for this repo. Its job is done.
#  - .github/workflows/ci-apply.yml: a TEMPORARY helper left behind by an earlier
#    session. Its own commit message says "Remove this temporary workflow from
#    main", but it never removed itself, and it declares a branch-level `push:`
#    trigger with `contents: write`. So it re-fires on EVERY push to main and
#    re-pushes a stale payload over TimerNotifier.kt and HabitCheckInNotifier.kt.
#    Left live, it can silently revert the committed fix.
#
# Pushing this also triggers build.yml, so the release build runs on the final
# tip of main -- that run is the verification.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove leftovers and push to main
        run: |
          set -euo pipefail
          git config user.name "mf2-agent"
          git config user.email "mf2-agent@users.noreply.github.com"
          git rm -q --ignore-unmatch diag.txt
          git rm -q --ignore-unmatch .github/workflows/ci-apply.yml
          git rm -q --ignore-unmatch .github/workflows/apply-timer-popup.yml .github/workflows/apply-timer-popup2.yml .github/workflows/apply-timer-popup3.yml .github/workflows/apply-timer-popup4.yml .github/workflows/apply-timer-cleanup.yml
          git status --short
          git commit -q -m "Remove apply-evidence file and a stale temporary CI pusher" -m "diag.txt was only ever a way to read CI compile output without admin job-log access, and the fix it verified is committed. .github/workflows/ci-apply.yml was a leftover temporary helper whose own message asked for its removal: it declares a branch-level push trigger with contents: write, so it re-fires on every push to main and re-pushes a stale payload over TimerNotifier.kt and HabitCheckInNotifier.kt, which can silently revert committed work." || echo "nothing to commit"
          git push origin HEAD:main
          echo "main is now:"
          git log -1 --format=%H
