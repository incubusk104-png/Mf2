name: Apply alarm-timer payload

# One-shot helper: unpacks the base64 payload staged in .payload/ into the
# repository root, commits it, and removes the staging files in the same commit.
# Triggered manually (workflow_dispatch) and deletes itself afterwards.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack payload
        run: |
          set -euo pipefail
          test -d .payload
          cat .payload/part_* > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.gz
          tar xzf /tmp/payload.tar.gz -C .
          rm -rf .payload
          echo "--- files now present ---"
          ls -la ALARM_REPORT.md
          ls -la android/app/src/main/java/com/rork/mindsetframestracker/notifications/ | head -40

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "incubusk104-png"
          git config user.email "incubusk104@gmail.com"
          git add -A
          git commit -m "Fix alarm reliability under Doze/revoked exact-alarm grants; add walk timer & stopwatch with one-time completion popup

- single AlarmScheduler core: setAlarmClock -> setExactAndAllowWhileIdle -> setAndAllowWhileIdle -> setWindow, never silently drops an alarm
- real Activity show-intent, namespaced PendingIntents, safe cancel
- BootReceiver preserves repeatDaysMask
- new timer stack + persisted one-time completion event (fires once per event, never on re-render/resume/nav/reboot)"
          git push origin HEAD:main
          git log --oneline -1
