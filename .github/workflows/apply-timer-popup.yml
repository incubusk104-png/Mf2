name: Apply timer popup fix

# Throwaway helper. Downloads a byte-exact payload, verifies its SHA-256,
# overlays it, COMPILES it, and only then pushes to main. The compile gate is
# the whole point: this repo has repeatedly had unbuilt code land on main and
# turn the release build red. If the compile fails, nothing is pushed and the
# real "e: " lines are published to the job summary.
#
# Deletes itself before committing, so main only ever receives the payload
# commit. Never leave this workflow on a branch with a push trigger.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Note the base commit
        run: git rev-parse HEAD | tee /tmp/base_sha.txt

      - name: Download, verify and overlay the payload
        env:
          PAYLOAD_URL: "https://static.teamily.ai/files/947c2acd-8be5-45e8-ab54-74d76f50e119/mf2_timer_payload.zip"
          PAYLOAD_SHA256: "6f6fe078ef155c2ebe5416425810d1041b61407e68b2b6ce40e4999fcfb76311"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/upd.zip "$PAYLOAD_URL"
          echo "$PAYLOAD_SHA256  /tmp/upd.zip" | sha256sum -c -
          mkdir -p /tmp/upd && unzip -q /tmp/upd.zip -d /tmp/upd
          test -d /tmp/upd/mf2_v7
          cp -a /tmp/upd/mf2_v7/. .
          rm -f .github/workflows/apply-timer-popup.yml
          echo "--- overlaid ---"
          git status --short

      - name: Compile release Kotlin and capture diagnostics
        run: |
          set +e
          (cd android && ./gradlew :app:compileReleaseKotlin --console=plain --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" -Porg.gradle.configuration-cache=false) > /tmp/compile.log 2>&1
          code=$?
          {
            echo "exit=$code"
            grep -E "^e: " /tmp/compile.log || echo "(no e: lines)"
            grep -E "Unresolved reference|Cannot infer|error:|Execution failed|BUILD SUCCESSFUL|BUILD FAILED" /tmp/compile.log | head -60 || true
          } > /tmp/diag.txt
          cat /tmp/diag.txt
          cat /tmp/diag.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Publish diagnostics to a readable branch
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git checkout -B timer-popup-diag
          cp /tmp/diag.txt diag.txt
          git add -f diag.txt
          git commit -m "Timer popup compile diagnostics" || true
          git push -f origin timer-popup-diag || true

      - name: Commit and push ONLY if the compile passed
        run: |
          set -euo pipefail
          if ! grep -q "^exit=0$" /tmp/diag.txt; then
            echo "::error::Compile FAILED - nothing was pushed to main. See the job summary for the real e: lines."
            exit 1
          fi
          echo "Compile passed: exit=0"
          git config user.name "mf2-agent"
          git config user.email "mf2-agent@users.noreply.github.com"
          rm -f diag.txt
          git checkout -- . 2>/dev/null || true
          git checkout -B main HEAD
          git add -A android/app/src/main .github/workflows
          echo "--- staged ---"
          git diff --cached --stat
          git commit -m "Show the timer/stopwatch popup when the alarm rings; move the ring path off the main thread" -m "The timer/stopwatch choice is no longer offered inside the alarm set-up dialog. It is now its own one-shot popup that appears automatically the moment a habit alarm rings, anchored to that habit's icon, and consumes its on-disk request on first show so it cannot repeat on re-render, resume, navigation or reboot." -m "Crash fix: AlarmRingingActivity resolved the habit icon with runBlocking(Dispatchers.IO) inside onCreate, on the main thread, before the alarm could ring. Moved to a LaunchedEffect on Dispatchers.IO after the first frame. Also guarded the remaining uncaught-exception paths that could kill the process (TimerService.onStartCommand foreground promotion, TimerService tick loop, and the alarm/timer/snooze/reminder receivers)." || echo "nothing staged"
          git push origin HEAD:main
