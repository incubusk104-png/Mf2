name: Apply and verify the Huawei login root-cause fix

# Throwaway workflow. It lands the Huawei root-cause fix onto a VERIFIED commit:
# the sandbox that produced the change has no git push credentials, so the diff
# is published as an artifact, fetched here, checked against a pinned sha256,
# applied, compiled, and only then committed.
#
# It pushes to a SEPARATE branch (verify/huawei-signin-verified) rather than the
# branch it runs on, so it cannot re-trigger itself. It also deletes itself in
# the commit it produces, so the throwaway never reaches main.
#
# The sha256 pin is the contract: if the patch is ever replaced, the fetch fails
# loudly instead of silently landing different code.
#
# Failures are published as commit statuses (context diag-N) because job logs
# require admin rights to download.

on:
  push:
    branches: ["verify/huawei-signin-diag"]
  workflow_dispatch: {}

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    name: Fetch, verify, compile, and publish a verified commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: verify/huawei-signin-diag
          fetch-depth: 0

      - name: Fetch the verified patch and check its sha256
        run: |
          set -e
          URL="https://static.teamily.ai/sites/af225f29-e9fd-450c-8058-051b001b4347/documents/mf2-huawei-diag/huawei-login-rootcause.patch"
          curl -fsSL "$URL" -o /tmp/fix.patch
          echo "9798b59bce9ff6f6a44b72447bf084178739b2def670233e35cbc341578dadac  /tmp/fix.patch" \
            | sha256sum -c - \
            || { echo "::error::sha256 mismatch — refusing to land unverified content"; exit 1; }
          echo "Patch fetched and hash-verified: $(wc -c < /tmp/fix.patch) bytes"
          echo "--- files the patch touches ---"
          git apply --stat /tmp/fix.patch

      - name: Apply the patch
        run: |
          set -e
          # --3way so a benign context drift still applies; a genuine conflict
          # aborts here rather than landing a half-applied tree.
          git apply --3way --whitespace=nowarn /tmp/fix.patch
          # git apply does NOT touch the index. Without this, every later
          # assertion and the final commit would see PRE-patch state.
          git add -A
          echo "--- applied ---"
          git status --short

      - name: Assert the fix is actually present after applying
        run: |
          set -e
          grep -q "fun checkAgcConfigPackageMatches" \
            android/app/src/main/java/com/rork/mindsetframestracker/auth/HuaweiServicesConfig.kt \
            || { echo "::error::the runtime package_name guard is missing"; exit 1; }
          grep -q "checkAgcConfigPackageMatches(activity)" \
            android/app/src/main/java/com/rork/mindsetframestracker/auth/HuaweiAuthClient.kt \
            || { echo "::error::the guard is not called from startSignIn"; exit 1; }
          grep -q "HUAWEI AGC CONFIG PACKAGE NAME MISMATCH" android/app/build.gradle.kts \
            || { echo "::error::the build-time package_name check is missing"; exit 1; }
          grep -q "c6b3544" HUAWEI_SIGNIN_SETUP.md \
            || { echo "::error::the runbook does not name the breaking commit"; exit 1; }
          grep -q "Case 3" .github/workflows/verify-huawei.yml \
            || { echo "::error::the local-file verification case is missing"; exit 1; }
          echo "OK: every fix is present after applying."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK platform
        run: |
          sdkmanager --install "platforms;android-36" "platform-tools"
          sdkmanager --install "build-tools;36.0.0" \
            || echo "::warning::build-tools 36.0.0 not installable; AGP will provision its default."

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode keystore (release builds must be signed)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Prepare a synthetic AGC config
        run: |
          set -e
          printf '%s' '{"client":{"app_id":"999000111","cp_id":"999000222","client_id":"999000333","client_secret":"SENTINEL_SECRET_DO_NOT_SHIP","api_key":"SENTINEL_API_KEY","package_name":"com.mindsetframes.habittracker"},"configuration_version":"3.0"}' \
            > /tmp/synthetic-agconnect.json
          echo "AGCONNECT_SERVICES_JSON_BASE64=$(base64 -w0 /tmp/synthetic-agconnect.json)" >> "$GITHUB_ENV"

      - name: Compile the release build with the fix applied
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ./gradlew :app:assembleRelease --rerun-tasks --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            -Porg.gradle.configuration-cache=false 2>&1 | tee /tmp/gradle.log
          exit ${PIPESTATUS[0]}

      - name: Assert the config still reaches the APK and the manifest
        working-directory: android
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          unzip -p "$APK" assets/agconnect-services.json > /tmp/from-apk.json
          grep -q "999000111" /tmp/from-apk.json \
            || { echo "::error::the config did not reach the APK assets"; exit 1; }
          for MF in $(find app/build/intermediates -name 'AndroidManifest.xml' -path '*release*'); do
            grep -q "appid=999000111" "$MF" || { echo "::error::manifest appid wrong"; exit 1; }
            grep -q "cpid=999000222" "$MF" || { echo "::error::manifest cpid wrong"; exit 1; }
          done
          if grep -q "SENTINEL_SECRET_DO_NOT_SHIP" /tmp/gradle.log; then
            echo "::error::client_secret leaked into the build log"; exit 1
          fi
          echo "OK: config bundled, manifest correct, no secret logged."

      - name: Remove the decoded keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: Commit the verified files and push to the verified branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The throwaway workflow must not reach main.
          git rm -f .github/workflows/apply-huawei-diag.yml
          git add -A
          git status --short
          # Heredoc, NOT -m "...": a multi-line message written as a quoted
          # string put its body at column 0 and broke out of this run block
          # scalar, making the whole workflow file unparseable.
          git commit -F - <<'MSG'
          fix(huawei): name the real cause of the Huawei sign-in failure

          Root cause: commit c6b3544 deleted android/app/agconnect-services.json
          from the working tree as well as the index (a plain 'git rm', not
          'git rm --cached'), and nothing replaced it at build time. Every build
          since then — local and CI — resolved no AGC config, so the APK shipped
          without one.

          This does not change the config-resolution behaviour for a build that
          HAS the file: the local file is still resolved first, and the
          asset/manifest wiring is untouched. What it adds is the ability to
          NAME the cause:

          - build.gradle.kts: warn when the resolved config's
            client.package_name does not match applicationId (the one config
            fault that yields no error code at all).
          - HuaweiServicesConfig.checkAgcConfigPackageMatches(): surface that
            mismatch in the UI instead of letting it look like a fingerprint
            problem.
          - HuaweiAuthClient.startSignIn(): call the guard before launching.
          - HUAWEI_SIGNIN_SETUP.md: document the breaking commit and recovery.
          - verify-huawei.yml: add a local-file case, a real-config secret-path
            case, static lints, and a final gate that can actually fail the run.
          MSG
          git push origin HEAD:refs/heads/verify/huawei-signin-verified
          echo "Pushed verified commit: $(git rev-parse HEAD)"

      - name: Publish build errors as commit statuses (readable without admin)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          sha, repo, tok = os.environ["SHA"], os.environ["REPO"], os.environ["GH_TOKEN"]
          out = []
          try:
              txt = open("/tmp/gradle.log", encoding="utf-8", errors="replace").read().splitlines()
              keep = [l for l in txt if l.startswith("e: ") or "error:" in l.lower() or "FAILURE" in l]
              out += keep[-25:]
          except FileNotFoundError:
              pass
          body = "\n".join(out)[-6000:] or "no gradle log captured"
          chunks = [body[i:i+1300] for i in range(0, len(body), 1300)] or ["(empty)"]
          for n, chunk in enumerate(chunks):
              data = json.dumps({"state": "failure", "context": "diag-%d" % n,
                                 "description": "Huawei fix build failed"}).encode()
              req = urllib.request.Request(
                  "https://api.github.com/repos/%s/statuses/%s" % (repo, sha), data=data,
                  headers={"Authorization": "Bearer %s" % tok,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=20)
                  print("published diag-%d" % n)
              except Exception as e:
                  print("status publish failed %d %s" % (n, e))
          print(body)
          PY
