name: restore-parent-fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore the two files to their pre-rewrite state
        run: |
          set -euo pipefail
          git checkout 5cf6b0e -- android/app/src/main/java/com/rork/mindsetframestracker/notifications/TimerNotifier.kt
          git checkout 5cf6b0e -- android/app/src/main/java/com/rork/mindsetframestracker/notifications/HabitCheckInNotifier.kt
          git rm -f .github/workflows/restore-parent-fix.yml
          echo "--- blob check (must match 5cf6b0e) ---"
          test "$(git hash-object android/app/src/main/java/com/rork/mindsetframestracker/notifications/TimerNotifier.kt)" = "$(git rev-parse 5cf6b0e:android/app/src/main/java/com/rork/mindsetframestracker/notifications/TimerNotifier.kt)"
          test "$(git hash-object android/app/src/main/java/com/rork/mindsetframestracker/notifications/HabitCheckInNotifier.kt)" = "$(git rev-parse 5cf6b0e:android/app/src/main/java/com/rork/mindsetframestracker/notifications/HabitCheckInNotifier.kt)"
          echo "blob check OK"
          git config user.name "mf2-restore-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Restore TimerNotifier and HabitCheckInNotifier to the working fix from 5cf6b0e"
          git push origin HEAD:main
