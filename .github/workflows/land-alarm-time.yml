name: Land the alarm-time fix (v16)

# Throwaway verify-then-land workflow. The sandbox has no git push credentials, so
# the diff is published as an artifact, fetched here, hash-checked, applied, built
# and tested on a runner with a full Android SDK, and only then committed.
#
# WHY THE LOG IS PUBLISHED INTO THE REPO: an earlier attempt's test step failed
# and the job log returned HTTP 403 (Actions logs need admin rights on this repo),
# so the compiler error was invisible. An unreadable failure is worth almost
# nothing, so this writes its log to a scratch branch, which raw.githubusercontent
# .com serves publicly. The gate then refuses to land unless gradle exited 0.
#
# ASSERTION HYGIENE: every assertion below is scoped to the specific construct it
# guards. An earlier version grep'd globally for a declaration that a SECOND, valid
# test also contains, and duly false-failed a perfectly good tree.

on:
  push:
    branches: ["verify/alarm-time-v16"]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  PATCH_URL: "https://static.teamily.ai/sites/af225f29-e9fd-450c-8058-051b001b4347/documents/mf2-review_v10/alarm-time-fix.patch"
  PATCH_SHA256: "eb51ab4ec2ce70e3fb9b4d844154200280961c54fe8ab4165928f8aff894f65e"

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch, hash-check and apply the patch
        run: |
          set -e
          curl -sSL --fail --retry 3 -o /tmp/feature.patch "$PATCH_URL"
          a=$(sha256sum /tmp/feature.patch | cut -d' ' -f1)
          echo "sha256=$a bytes=$(wc -c < /tmp/feature.patch)"
          [ "$a" = "$PATCH_SHA256" ] || { echo "::error::patch sha256 mismatch"; exit 1; }
          git apply /tmp/feature.patch || {
            echo "::error::the patch does not apply"
            git apply --check /tmp/feature.patch 2>&1 | head -40
            exit 1
          }
          git add -A
          echo "entries changed: $(git status --porcelain | wc -l)"

      - name: Assert the fix is really present in the applied tree
        run: |
          set -e
          B=android/app/src/main/java/com/rork/mindsetframestracker
          for f in $B/data/HabitAlarmDraft.kt $B/data/HabitAlarmSetup.kt \
                   $B/ui/components/HabitAlarmOverviewSection.kt \
                   android/app/src/test/java/com/rork/mindsetframestracker/data/HabitAlarmDraftTest.kt; do
            [ -f "$f" ] || { echo "::error::$f missing after apply"; exit 1; }
          done
          if grep -nE "mutableStateOf\(initialTimes|var times by remember" $B/ui/screens/HabitsScreen.kt; then
            echo "::error::the remember-seeded time list is still present"; exit 1
          fi
          grep -q "HabitAlarmDraft.forExistingHabit" $B/ui/screens/HabitsScreen.kt \
            || { echo "::error::picker does not seed from HabitAlarmDraft"; exit 1; }
          grep -q "HabitAlarmOverviewSection(" $B/ui/screens/HabitsScreen.kt \
            || { echo "::error::overview not wired into the picker"; exit 1; }
          grep -q "HabitAlarmOverviewSection(" $B/ui/components/HabitTrackingSheet.kt \
            || { echo "::error::overview not wired into the habit-today sheet"; exit 1; }
          grep -q "restoredAlarmTimes" $B/data/SupabaseSync.kt \
            || { echo "::error::cloud restore path not guarded"; exit 1; }
          awk '/^private fun AlarmPickerDialog/,/^}/' $B/ui/screens/HabitsScreen.kt \
            | grep -q "val s = appStrings()" \
            || { echo "::error::AlarmPickerDialog has no val s = appStrings()"; exit 1; }
          awk '/fun `an existing habit with no alarm opens empty and stays empty`/,/^    }/' \
            android/app/src/test/java/com/rork/mindsetframestracker/data/HabitAlarmDraftTest.kt \
            | grep -qE "^\s*var draft" \
            || { echo "::error::the reassigned draft is not declared var"; exit 1; }
          echo "all assertions passed"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK platform
        run: sdkmanager --install "platforms;android-36" "platform-tools" || true

      - run: chmod +x android/gradlew

      - name: Run unit tests (log captured, verdict deferred)
        run: |
          set +e
          ( cd android && ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon ) > /tmp/test.log 2>&1
          rc=$?
          echo "GRADLE_RC=$rc" >> "$GITHUB_ENV"
          echo "gradle_exit=$rc"
          tail -25 /tmp/test.log

      - name: Publish the build log into the repo so it is readable
        if: always()
        run: |
          set +e
          mkdir -p /tmp/up
          printf 'gradle_exit=%s\nhead_sha=%s\nrun_id=%s\n' \
            "${GRADLE_RC:-unknown}" "${{ github.sha }}" "${{ github.run_id }}" > /tmp/up/verdict.txt
          { java -version 2>&1; nproc; free -m; } > /tmp/up/env.txt 2>&1
          grep -nE "^e: |error:|FAILED|expected:|AssertionError|Execution failed|Caused by|Unresolved reference|Type mismatch|Compilation error" \
            /tmp/test.log | head -300 > /tmp/up/errors.txt 2>/dev/null
          tail -c 150000 /tmp/test.log > /tmp/up/tail.txt 2>/dev/null
          python3 - <<'PY' > /tmp/up/totals.txt 2>&1
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('android/**/test-results/**/*.xml', recursive=True)
          print("xml files:", len(files))
          tot = fail = err = skip = 0
          for f in files:
              try: r = ET.parse(f).getroot()
              except Exception as e: print("unparsable", f, e); continue
              tot += int(r.get('tests', 0)); fail += int(r.get('failures', 0))
              err += int(r.get('errors', 0)); skip += int(r.get('skipped', 0))
              for c in r.iter('testcase'):
                  for b in list(c.iter('failure')) + list(c.iter('error')):
                      print("FAILED %s.%s\n%s" % (c.get('classname'), c.get('name'), (b.text or '')[:1200]))
          print("TOTALS tests=%d failures=%d errors=%d skipped=%d" % (tot, fail, err, skip))
          PY
          git worktree add -q /tmp/wt -b ci-log-branch 2>/dev/null || git worktree add -q /tmp/wt ci-log-branch
          cp /tmp/up/* /tmp/wt/ 2>/dev/null
          cd /tmp/wt
          git add -f ./*.txt
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "ci: alarm-time log (run ${{ github.run_id }}, gradle exit ${GRADLE_RC:-unknown})"
          git push -f origin HEAD:refs/heads/verify/alarm-time-logs
          echo "::notice::log published to verify/alarm-time-logs"

      - name: Fail unless the unit tests passed
        if: always()
        run: |
          if [ "${GRADLE_RC:-unknown}" != "0" ]; then
            echo "::error::gradle exited ${GRADLE_RC:-unknown} - see verify/alarm-time-logs"
            exit 1
          fi
          echo "::notice::unit tests passed on the patched tree"

      - name: Land onto main
        run: |
          set +e
          # WHY `reset --soft origin/main`: this job checks out the BRANCH tip, so a
          # plain commit would have the branch commit as its parent. Pushing that to
          # main is a NON-FAST-FORWARD (main does not contain the branch commit) and
          # git rejects it - which is exactly how v15 failed after its tests passed.
          # `reset --soft origin/main` moves HEAD onto main while keeping the index,
          # so the new commit's parent IS main's tip and the push fast-forwards. The
          # tree is untouched, so the tested content is exactly what lands.
          git rm -q .github/workflows/land-alarm-time.yml 2>/dev/null || true
          git rm -q .github/workflows/apply-ringfix.yml 2>/dev/null || true
          git fetch -q origin main
          git reset -q --soft origin/main
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -F - <<'MSG'
          fix(alarms): stop a removed alarm time from coming back, and show the day in the habit-today dialog

          Root cause of "every time I remove it, the actual time defaults back in
          there": AlarmPickerDialog held its schedule in an unkeyed `remember`
          seeded as `initialTimes.ifEmpty { listOf(defaultMinutes) }`. Because
          `initialTimes` came from the habit's SAVED list, an `ifEmpty` could not
          tell a habit that never had an alarm from one whose alarm the user had
          just removed - both are empty, so the icon's default went straight back.
          Any recomposition that recreated the remembered slot re-ran the seed.

          The seed rule now lives in a pure value, HabitAlarmDraft: an existing
          habit's draft is `decided`, so no default can be injected into a
          schedule the user has emptied. Removing the last time is a real,
          supported outcome and the confirm button is no longer gated on a
          non-empty list, so "no alarm" is now savable.

          The habit-today sheet and the picker now render ONE shared overview
          (HabitAlarmOverviewSection), one row per scheduled time, so a habit set
          for 07:00/12:00/18:00 always shows three rows with each occurrence's
          state and the line it delivered. Rows come from the schedule, so a time
          that passed with nothing recorded shows as MISSED rather than
          disappearing. The same section reports what is set up inside the habit:
          schedule, repeat rule, the resolved alarm line, and the trackers that
          can supply it.

          Also closes a second resurrection path: a cloud habit row can land with
          a stale non-empty alarm_times and a null reminder_minutes when the
          alarm_times column is absent server-side. restoredAlarmTimes treats
          that inconsistent pair as a cleared alarm instead of restoring it.

          Removes the stale apply-ringfix workflow, which pushed to main on every
          push via an old remote script.

          Tests: 19 new JVM cases covering removal-persists, no-default-reseed,
          three same-day times surviving a save/reload round trip, and the
          overview listing every occurrence.
          MSG
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:main > /tmp/pushout.txt 2>&1
          pushrc=$?
          cat /tmp/pushout.txt
          echo "push_exit=$pushrc" >> /tmp/pushout.txt
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "TREE=$(git rev-parse HEAD^{tree})"
            echo "PARENT=$(git rev-parse HEAD^)"
            cat /tmp/pushout.txt
          } > /tmp/up/push.txt 2>&1 || true
          git worktree add -q /tmp/wt2 -b ci-push-log 2>/dev/null || git worktree add -q /tmp/wt2 ci-push-log
          cp /tmp/up/push.txt /tmp/wt2/ 2>/dev/null
          ( cd /tmp/wt2 && git add -f ./push.txt && \
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "ci: push result" && \
            git push -f origin HEAD:refs/heads/verify/alarm-time-push ) || true
          if [ "$pushrc" != "0" ]; then
            echo "::error::the push to main failed (exit $pushrc) - see verify/alarm-time-push/push.txt"
            exit 1
          fi
          echo "::notice::landed $(git rev-parse HEAD)"
