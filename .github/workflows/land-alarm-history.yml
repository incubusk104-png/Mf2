name: Land the alarm-history feature

# One-shot landing job: applies, verifies, compiles and lands "per-occurrence
# alarm history in the habit dialog" onto main.
#
# ## Why this exists
#
# The sandbox that authored the change cannot run Gradle (2 GB memory cap; the
# Kotlin/AGP toolchain is OOM-killed throughout) and has no GitHub push
# credentials — `git push` prompts for a username and dies. Both the compile
# signal and the landing therefore need a runner with a real Android SDK and a
# token, the same approach used for the earlier Huawei and i18n verification.
#
# ## Why this file is thin
#
# It had to be written into the repo through the GitHub file API from that same
# credential-less sandbox, so the less text transcribed byte-for-byte, the less
# chance a transcription slip alters the thing being verified. All of the logic —
# the sha256 check, the patch apply, the three invariant assertions, the compile
# gate and the landing — lives in land-alarm-history.sh, fetched by sha256 from
# an immutable URL rather than retyped.
#
# The workflow DELETES ITSELF as part of the landing commit: it is scaffolding
# for one change, not part of the shipped pipeline.
#
# ## Loop safety
#
# The landing push re-enters this workflow (it fires on pushes to main). The
# script's first action is to exit when the feature is already present, so the
# second run is a no-op and the loop is bounded.
#
# ## The two traps this workflow is written around
#
# 1. `contents: read` (the default) cannot push. `verify-huawei.yml` declared only
#    read, so its final `git push` failed and its change was left unlanded.
#    `contents: write` is declared below.
# 2. `android-actions/setup-android@v3` must NOT be left on its default package
#    list. The default is `tools platform-tools`, and Google has REMOVED the
#    legacy `tools` package — `sdkmanager tools` exits 1 with "Failed to find
#    package 'tools'", which fails the step and silently skips everything after
#    it. A first run of this workflow failed exactly there, in 15s, having never
#    reached the script. The package list is pinned to `platform-tools` and the
#    real platform installed explicitly, mirroring build.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        # AGP 8.13 requires JDK 17 to run Gradle.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # Pinned package list — see trap 2 above. The default list includes the
        # vanished legacy `tools` package and fails the step before the script
        # ever runs.
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK platform and build-tools
        # compileSdk/targetSdk are 36 (see app/build.gradle.kts) and AGP is 8.13.2,
        # so the project needs platforms;android-36. Installed explicitly so the
        # versions stay visible here and a future change to the sdkmanager
        # repository cannot silently leave the platform missing again.
        # build-tools is allowed to be absent: AGP provisions its own default
        # automatically once the licenses are accepted.
        run: |
          sdkmanager --install "platforms;android-36" "platform-tools"
          sdkmanager --install "build-tools;36.0.0" \
            || echo "::warning::build-tools 36.0.0 not installable; AGP will provision its default."

      - name: Run the landing script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Fetched rather than retyped, so the executed logic is exactly what was
          # published. Both the wrapper and the script verify the sha256: the value
          # here so a corrupt download fails before it can run, and again inside the
          # script so the checked patch and the applied patch are the same bytes.
          curl -sS --fail --location \
            -o /tmp/land.sh \
            "https://static.teamily.ai/files/82101184-d320-40e9-bb14-c1469da3c0f2/land-alarm-history.sh"

          actual=$(sha256sum /tmp/land.sh | cut -d' ' -f1)
          expected="cc7159dbb94a085d5ce792c0dc34e98b12f69cbe4bd31d5b1de01948402cabab"
          echo "script sha256: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::landing script sha256 mismatch — refusing to run"
            exit 1
          fi
          echo "script verified"

          bash /tmp/land.sh
